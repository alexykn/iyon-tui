name: TUI API and ABI parity

on:
  push:
    branches: [bun-refactor, main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "packages/iyon-tui/**"
      - "packages/tui-consumer-fixture/**"
      - "tools/api-surface/**"
      - "tools/ownership/**"
      - "tools/tui-abi/**"
      - "tools/tui-abi-gen/**"
      - ".github/workflows/api-surface.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "packages/iyon-tui/**"
      - "packages/tui-consumer-fixture/**"
      - "tools/api-surface/**"
      - "tools/ownership/**"
      - "tools/tui-abi/**"
      - "tools/tui-abi-gen/**"
      - ".github/workflows/api-surface.yml"

jobs:
  parity:
    name: Stable API and ABI parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-features
      - run: cargo test -p tui-abi-gen
      - run: bun install --frozen-lockfile
      - run: bun run check:tui-abi
      - run: bun run typecheck
      - run: bun run native:stage
      - run: bun run check:ownership
      - run: git diff --check
