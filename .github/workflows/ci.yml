name: Iyon TUI checks

on:
  push:
    branches: [bun-refactor, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Detect Rust-impacting changes
        id: rust_changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run_clippy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" -- \
            Cargo.toml \
            Cargo.lock \
            clippy.toml \
            crates \
            tools/tui-abi-gen \
            tools/lint; then
            echo "run_clippy=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_clippy=true" >> "$GITHUB_OUTPUT"
          fi
      - run: cargo fmt --all -- --check
      - name: Run Clippy gate for Rust-impacting changes
        if: steps.rust_changes.outputs.run_clippy == 'true'
        run: sh tools/lint/clippy-gate.sh
      - name: Run workspace tests independently of lint result
        if: ${{ !cancelled() }}
        run: cargo test --workspace --all-features

  bun:
    name: Bun and N-API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: bun install --frozen-lockfile
      - run: bun run check:tui-abi
      - run: cargo test -p tui-abi-gen
      - run: |
          git diff --exit-code -- \
            crates/iyon-tui/src/occurrence/generated.rs \
            packages/iyon-tui/src/transport/ui/generated \
            docs/architecture/generated/UI-ABI-REFERENCE.md
      - run: bun run typecheck
      - run: bun run lint:ts
      - run: bun run check:tui-declarations
      - run: bun run native:stage
      - run: bun run check:tui-binding
      - run: bun run check:ownership
      - run: bun test packages/iyon-tui/tests packages/tui-consumer-fixture/tests
      - name: Run packaged React/native smoke
        run: bun run native:smoke
      - name: Run canonical Source content FFI tests
        run: cargo test -p iyon-tui-native content_ffi::tests --lib
      - name: Run instrumented React content benchmark
        run: |
          ION_NATIVE_FEATURES=perf-counters bun run native:stage
          ION_CONTENT_BENCH_COUNT=1000 bun run perf:content
      - name: Restore default N-API addon
        if: always()
        run: bun run native:stage
