name: Iyon checks

on:
  push:
    branches: [bun-refactor]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  bun:
    name: Bun plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check:bun-version
      - run: bun run check:tui-abi
      - run: cargo test -p tui-abi-gen
      - run: git diff --exit-code -- crates/iyon-native/src/generated crates/iyon-native/include crates/iyon-native/tests/generated_view_abi.rs packages/iyon-runtime/src/tui/generated packages/iyon-runtime/tests/generated packages/iyon-runtime/bench/generated docs/history/perf/PERF-11-generated-abi-reference.md
      - run: bun run typecheck:plugins
      - run: bun run typecheck
      - run: bun test plugins/providers packages/iyon-runtime/test/providers
      - run: bun test packages/iyon-plugins/tests
      - run: bun test plugins/app/iyon/test packages/iyon-cli/test/args.test.ts packages/iyon-cli/test/bootstrap.test.ts packages/iyon-cli/test/auth.test.ts packages/iyon-cli/test/runner.test.ts
      - run: bunx tsc --noEmit
      - run: cargo test -p iyon --test public_app
      - run: bun run build:iyon
      - run: dist/iyon --help
      - run: IYON_PROVIDER=mock dist/iyon auth status
      - run: test -f tranche_6_bun_refactor.md
