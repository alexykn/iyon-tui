name: Iyon TUI checks

on:
  push:
    branches: [bun-refactor, main]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: sh tools/lint/clippy-gate.sh
      - run: cargo test --workspace --all-features

  bun:
    name: Bun and N-API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: bun install --frozen-lockfile
      - run: bun run check:tui-abi
      - run: cargo test -p tui-abi-gen
      - run: |
          git diff --exit-code -- \
            crates/iyon-tui-native/src/generated \
            crates/iyon-tui-native/include \
            crates/iyon-tui-native/tests/generated_view_abi.rs \
            packages/iyon-tui/src/transport/abi/structural/generated \
            packages/iyon-tui/tests/generated \
            packages/iyon-tui/bench/generated \
            docs/history/perf/PERF-11-generated-abi-reference.md
      - run: bun run typecheck
      - run: bun run lint:ts
      - run: bun run check:tui-declarations
      - run: bun run native:stage
      - run: bun run check:ownership
      - run: bun test packages/iyon-tui/tests packages/tui-consumer-fixture/tests
      - run: |
          T15_TRANSPORT=generated_safe_napi \
          T15_WORKLOAD=plain_text \
          T15_MODE=shared_path \
          T15_SIZE=20 \
          T15_WARMUP=2 \
          T15_MEASURED=20 \
          bun run packages/iyon-tui/bench/perf12_t15_authoritative_case.ts

  direct-ffi:
    name: Feature-gated direct FFI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: bun install --frozen-lockfile
      - run: ION_NATIVE_FEATURES=direct-ffi bun run packages/iyon-tui/scripts/stage-native.ts
      - run: |
          T15_TRANSPORT=feature_gated_direct_ffi \
          T15_WORKLOAD=plain_text \
          T15_MODE=shared_path \
          T15_SIZE=20 \
          T15_WARMUP=2 \
          T15_MEASURED=20 \
          bun run packages/iyon-tui/bench/perf12_t15_direct_case.ts
