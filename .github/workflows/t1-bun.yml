name: Standalone TUI native viability

on:
  push:
    branches: [bun-refactor, main]
  pull_request:

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: macos-arm64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun 1.4.0
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Report toolchains
        run: |
          bun --version
          rustc --version
          cargo --version

      - name: Install Bun workspace
        run: bun install --frozen-lockfile

      - name: Check Rust workspace
        run: cargo check --workspace --all-features

      - name: Check generated TUI ABI
        run: |
          bun run check:tui-abi
          cargo test -p tui-abi-gen
          git diff --exit-code -- \
            crates/iyon-tui-native/src/generated \
            crates/iyon-tui-native/include \
            crates/iyon-tui-native/tests/generated_view_abi.rs \
            packages/iyon-tui/src/transport/abi/structural/generated \
            packages/iyon-tui/tests/generated \
            packages/iyon-tui/bench/generated \
            docs/history/perf/PERF-11-generated-abi-reference.md

      - name: Stage and load default N-API addon
        run: bun run native:stage

      - name: Typecheck and ownership checks
        run: |
          bun run typecheck
          bun run check:tui-declarations
          bun run check:ownership

      - name: Run default N-API tests
        run: bun test packages/iyon-tui/tests packages/tui-consumer-fixture/tests

      - name: Stage and load direct FFI addon
        run: ION_NATIVE_FEATURES=direct-ffi bun run packages/iyon-tui/scripts/stage-native.ts

      - name: Run direct FFI parity smoke
        run: |
          T15_TRANSPORT=feature_gated_direct_ffi \
          T15_WORKLOAD=plain_text \
          T15_MODE=shared_path \
          T15_SIZE=20 \
          T15_WARMUP=2 \
          T15_MEASURED=20 \
          bun run packages/iyon-tui/bench/perf12_t15_direct_case.ts

      - name: Check generated files are clean
        run: |
          git diff --check
          test -z "$(git status --short --untracked-files=all | grep -E '(^|/)(iyon-tui-native\.node|dist/)' || true)"
