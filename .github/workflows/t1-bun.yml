name: Standalone TUI native viability

on:
  push:
    branches: [bun-refactor, main]
  pull_request:

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: macos-arm64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun 1.4.0
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Report toolchains
        run: |
          bun --version
          rustc --version
          cargo --version

      - name: Install Bun workspace
        run: bun install --frozen-lockfile

      - name: Check Rust workspace
        run: cargo check --workspace --all-features

      - name: Check generated TUI ABI
        run: |
          bun run check:tui-abi
          cargo test -p tui-abi-gen
          git diff --exit-code -- \
            crates/iyon-tui/src/occurrence/generated.rs \
            packages/iyon-tui/src/transport/ui/generated \
            docs/architecture/generated/UI-ABI-REFERENCE.md

      - name: Stage and load default N-API addon
        run: bun run native:stage

      - name: Typecheck and ownership checks
        run: |
          bun run typecheck
          bun run check:tui-declarations
          bun run check:tui-binding
          bun run check:ownership

      - name: Run default N-API tests
        run: bun test packages/iyon-tui/tests packages/tui-consumer-fixture/tests
      - name: Run packaged React/native smoke
        run: bun run native:smoke

      - name: Run canonical Source content FFI tests
        run: cargo test -p iyon-tui-native content_ffi::tests --lib

      - name: Run instrumented React content benchmark
        run: |
          ION_NATIVE_FEATURES=perf-counters bun run native:stage
          ION_CONTENT_BENCH_COUNT=1000 bun run perf:content

      - name: Restore default N-API addon
        if: always()
        run: bun run native:stage

      - name: Check generated files are clean
        run: |
          git diff --check
          test -z "$(git status --short --untracked-files=all | grep -E '(^|/)(iyon-tui-native\.node|dist/)' || true)"
