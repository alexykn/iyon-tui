[workspace]
members = [
    "crates/iyon-tui",
    "crates/iyon-tui-native",
    "tools/tui-abi-gen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
askama = "0.14.0"
blake3 = "1.8.2"
bytemuck = { version = "1.25.0", features = ["derive"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
termwiz = { version = "=0.23.3", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
syn = { version = "2.0.106", features = ["full", "visit", "extra-traits"] }
cargo_metadata = "0.23.1"
indexmap = { version = "2.13.0", features = ["serde"] }
miette = { version = "7.6.0", features = ["fancy"] }
prettyplease = "0.2.37"
quote = "1.0.0"
proc-macro2 = "1.0.106"
serde_path_to_error = "0.1.20"
static_assertions = "1.1.0"
thiserror = "2.0.17"
toml_edit = { version = "0.23.7", features = ["serde"] }
tokio = { version = "1.52.1", features = ["full", "test-util"] }
tempfile = "3.23.0"
toml = "1.1.2"
unicode-segmentation = "1.13.2"
unicode-width = "0.2.2"
unicode-linebreak = "0.1.5"
pulldown-cmark = { version = "=0.13.4", default-features = false }
napi = { version = "3.12.1", features = ["async", "serde-json"] }
napi-derive = "3.6.3"

# Test-only tooling, pulled in by crates via [dev-dependencies].
vt100 = "0.16.2"
proptest = "1.11.0"
insta = "1.48.0"
trybuild = "1.0.114"

iyon-tui = { path = "crates/iyon-tui" }

# Strictness rollout: clippy pedantic + cognitive complexity report as warnings
# on every target. CI denies all other warnings (`-D warnings`) while keeping
# these two groups at warn until the audit backlog is fixed, then they flip
# to deny. No blanket `allow`s live here; the only accepted `allow`s are
# targeted ones required by the unsafe FFI boundary and generated ABI code.
[workspace.lints.clippy]
pedantic = "warn"
cognitive_complexity = "warn"
