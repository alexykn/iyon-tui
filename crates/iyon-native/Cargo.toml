[package]
name = "iyon-native"
license = "MIT"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
perf-counters = ["iyon-tui/perf-counters"]
perf-packed-transport = ["iyon-tui/native-shared-memory"]
perf-packed-benchmark = ["perf-packed-transport", "perf-counters"]
perf-packed-timing = ["perf-packed-transport", "perf-counters", "iyon-tui/perf-timing"]
fast-view-abi = []

[dependencies]
bytemuck.workspace = true
iyon-api.workspace = true
iyon-core.workspace = true
iyon-tui = { workspace = true, features = ["native-host"] }
futures-util.workspace = true
keyring.workspace = true
napi.workspace = true
napi-derive.workspace = true
serde.workspace = true
serde_json.workspace = true
static_assertions.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[build-dependencies]
napi-build = "2.4.1"
serde_json.workspace = true
