[package]
name = "iyon-tui-native"
license = "MIT"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
perf-counters = ["iyon-tui/perf-counters"]
fast-view-abi = []
# Structural qualification symbols remain feature-gated. PERF-13-E content-data
# ABI v1 symbols are part of the default artifact alongside the N-API surface.
direct-ffi = []

[dependencies]
bytemuck.workspace = true
iyon-tui = { workspace = true, features = ["native-host"] }
napi.workspace = true
napi-derive.workspace = true
serde_json.workspace = true
static_assertions.workspace = true

[build-dependencies]
napi-build = "2.4.1"

# Strictness is inherited from the workspace root: clippy pedantic and
# cognitive complexity report as warnings on all targets. The unsafe FFI
# boundary documents its contracts with `# Safety` sections instead of
# blanket allows; generated ABI files carry their own machine-generated
# header allows (see tools/tui-abi-gen/src/render_rust.rs).
[lints]
workspace = true
