[package]
name = "iyon-tui-native"
license = "MIT"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
perf-counters = ["iyon-tui/perf-counters"]

[dependencies]
iyon-tui = { workspace = true, features = ["native-host"] }
napi.workspace = true
napi-derive.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
napi-build = "2.4.1"

[dev-dependencies]
tokio.workspace = true
# Cross-crate Source FFI failure tests need the core's test-only host poison
# hook; the hook is not enabled for the shipped native artifact.
iyon-tui = { workspace = true, features = ["native-host", "test-util"] }

# Strictness is inherited from the workspace root: clippy pedantic and
# cognitive complexity report as warnings on all targets. The unsafe FFI
# boundary documents its contracts with `# Safety` sections instead of
# blanket allows; generated ABI files carry their own machine-generated
# header allows (see tools/tui-abi-gen/src/render_rust.rs).
[lints]
workspace = true
