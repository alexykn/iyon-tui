[package]
name = "iyon-tui"
license = "MIT"
version.workspace = true
edition.workspace = true

[features]
test-util = []
native-host = []
perf-counters = []

[[bin]]
name = "tui_perf"
path = "src/bin/tui_perf.rs"
required-features = ["perf-counters"]

[dependencies]
anyhow.workspace = true
crossterm.workspace = true
termwiz.workspace = true
unicode-segmentation.workspace = true
unicode-linebreak.workspace = true
tokio.workspace = true
pulldown-cmark.workspace = true

[dev-dependencies]
vt100.workspace = true
proptest.workspace = true
insta.workspace = true
trybuild.workspace = true

# The framework intentionally retains owner-thread handles, compatibility
# paths, and measurement helpers whose shapes are not Clippy's defaults.
[lints.rust]
dead_code = "allow"

[lints.clippy]
arc_with_non_send_sync = "allow"
bind_instead_of_map = "allow"
bool_assert_comparison = "allow"
collapsible_if = "allow"
derivable_impls = "allow"
field_reassign_with_default = "allow"
if_same_then_else = "allow"
iter_cloned_collect = "allow"
let_unit_value = "allow"
manual_clamp = "allow"
manual_inspect = "allow"
manual_is_multiple_of = "allow"
needless_borrows_for_generic_args = "allow"
needless_lifetimes = "allow"
needless_range_loop = "allow"
new_without_default = "allow"
obfuscated_if_else = "allow"
ptr_arg = "allow"
question_mark = "allow"
redundant_closure_call = "allow"
redundant_slicing = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_cast = "allow"
unnecessary_mut_passed = "allow"
unnecessary_unwrap = "allow"
unused_enumerate_index = "allow"
useless_conversion = "allow"
