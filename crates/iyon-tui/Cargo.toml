[package]
name = "iyon-tui"
license = "MIT"
version.workspace = true
edition.workspace = true
# L1-01: the core crate is runtime implementation for the in-tree native
# binding, not a supported authoring package. External UI code authors
# against the TypeScript `@iyon/tui` surface instead.
publish = false

[features]
# Internal test hooks used by the in-tree/native test targets. This feature
# never restores a public Rust testing facade.
test-util = []
native-host = []
# Counter exports and the package-local `tui_perf` binary are hidden tooling
# seams, not supported Rust authoring APIs.
perf-counters = []

[[bin]]
name = "tui_perf"
path = "src/bin/tui_perf.rs"
required-features = ["perf-counters"]

[dependencies]
anyhow.workspace = true
crossterm.workspace = true
termwiz.workspace = true
unicode-segmentation.workspace = true
unicode-linebreak.workspace = true
tokio.workspace = true
pulldown-cmark.workspace = true

[dev-dependencies]
vt100.workspace = true
proptest.workspace = true
insta.workspace = true

# Strictness is inherited from the workspace root: clippy pedantic and
# cognitive complexity report as warnings on all targets. Site-specific
# `#[allow]`s in source remain and are tracked in the audit backlog.
[lints]
workspace = true
