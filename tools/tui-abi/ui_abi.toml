code = 0x01
section = "structure"
operands = ["local_ordinal", "host_kind"]

[[opcode]]
name = "CreateRoot"
code = 0x02
section = "structure"
operands = ["local_ordinal", "root_role", "owner_handle_or_null", "config_metadata"]

