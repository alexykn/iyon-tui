# Existing finite state semantics are carried into the occurrence document.
# IDs are globally unique and intentionally leave room for future domains.
# Property payload layouts are declared by the value_encoding rows above and
# emitted into the Rust/TypeScript descriptors. The native decoder retains
# handwritten semantic validation for each finite encoding algorithm.
[[property]]
id = 0x0101
domain = "geometry"
name = "width"
value = "SizeMode"
legal_kinds = ["Box", "ContentHost", "Editor", "Scroll", "Animation"]
normalizer = "size_mode"
default = "unset"
reset = "unset"
override_behavior = "explicit"
inheritance = "none"
effects = ["LayoutInput", "ContentProjection"]
realization = "layout"
nullable = false
clearable = true

