forms = [{ name = "metadata_pairs_x8", word_count = 16 }]

[[value_encoding]]
value_kind = "TextAttributes"
encoding = "set_or_clear_bits_v1"
min_words = 1
max_words = 2
forms = [{ name = "set_or_clear", word_count = 2, mask = 0x3f }]

[[value_encoding]]
value_kind = "Style"
encoding = "direct_or_themed_style_v1"
min_words = 9
max_words = 12
metadata_words = 2
forms = [
  { name = "direct", word_count = 9, tags = [0, 1, 2], mask = 0x3f },
  { name = "themed", word_count = 12, tags = [0, 1, 2], mask = 0x3f }
]

