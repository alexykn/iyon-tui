encoding = "u32_enum"
min_words = 1
max_words = 1
forms = [{ name = "mode", word_count = 1, values = [0, 1] }]

[[value_encoding]]
value_kind = "U16"
encoding = "u16"
min_words = 1
max_words = 1
forms = [{ name = "u16", word_count = 1, max_value = 65535 }]

[[value_encoding]]
value_kind = "Insets"
encoding = "u16x4"
min_words = 4
max_words = 4
forms = [{ name = "u16x4", word_count = 4 }]

[[value_encoding]]
value_kind = "Alignment"
encoding = "axis_x2"
min_words = 2
max_words = 2
forms = [{ name = "axis_pair", word_count = 2, values = [0, 1, 2, 3, 4] }]

[[value_encoding]]
value_kind = "Edges"
encoding = "bool_x4"
min_words = 4
max_words = 4
forms = [{ name = "bool_x4", word_count = 4, values = [0, 1] }]

[[value_encoding]]
value_kind = "Color"
encoding = "ansi_or_rgb_v1"
min_words = 1
max_words = 4
forms = [
  { name = "ansi", word_count = 1, max_value = 255 },
  { name = "rgb", word_count = 4, tags = [0x80000001] }
]

[[value_encoding]]
value_kind = "BorderStyle"
encoding = "u32_enum"
min_words = 1
max_words = 1
forms = [{ name = "border", word_count = 1, values = [0, 1, 2] }]

[[value_encoding]]
