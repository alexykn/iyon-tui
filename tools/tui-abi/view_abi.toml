# PERF-12 T5 (§63): semantic materializer declarations. Each entry lowers one
# BridgeViewNode kind into generated FFI constructor arguments, children
# first, with explicit lifetime policy (§64/§68/§69). The T5 vertical slice
# is the spacer kind end-to-end.

[[materializer]]
name = "spacer"
bridge_kind = "viewSpacer"
rust_builder = "view_spacer_create"
fallback = "direct_decode"
ownership = "runtime_owned"
borrow_duration = "call"
thread_affinity = "owner_thread"
status_detail = "none"
benchmark_registration = "materialize.spacer"

[materializer.result]
kind = "view_ref"

[[materializer.field]]
name = "node_id_low"
source = "id_low"
type = "u32"
role = "node_id_low"

[[materializer.field]]
name = "node_id_high"
source = "id_high"
type = "u32"
role = "node_id_high"

[[materializer.field]]
name = "rows"
source = "rows"
type = "u32"
role = "scalar"

# PERF-12 T7 (§22/§32): fixed-arity axis materializers. Children are lowered
# first through ensureNative and the parent is built by one monomorphic
# family constructor dispatched on child count (arity 0..=4 baseline).
# Arity above the family maximum raises a fast fallback for the complete
# cold path until T8's borrowed ref-buffer lane.

[[materializer]]
name = "row"
bridge_kind = "viewRow"
rust_builder = "view_row_create_0"
fallback = "direct_decode"
ownership = "runtime_owned"
borrow_duration = "call"
thread_affinity = "owner_thread"
status_detail = "none"
benchmark_registration = "materialize.row"

[materializer.result]
kind = "view_ref"

[materializer.fixed_arity_axis]
builders = [
  "view_row_create_0",
  "view_row_create_1",
  "view_row_create_2",
  "view_row_create_3",
  "view_row_create_4",
]
buffer_builder = "view_axis_create_buffer"

[[materializer.field]]
name = "node_id_low"
source = "id_low"
type = "u32"
role = "node_id_low"

[[materializer.field]]
name = "node_id_high"
